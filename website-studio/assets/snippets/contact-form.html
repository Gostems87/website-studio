<!--
  Website Studio contact form: accessible, spam-resistant, no framework.

  Preview: leave MODE as 'preview'. Nothing is sent; the visitor sees what would happen.
  Live:    set MODE to 'live', paste the Web3Forms access key, and delete the block marked
           as preview code. The key is public by design: it only lets the form post to one inbox.

  Style the classes to match DESIGN.md. Change OWNER, EMAIL and SUBJECT.
-->
<style>#enquiry [hidden], #enquiry-done[hidden] { display: none !important; }</style>
<form id="enquiry" method="post" action="#" novalidate>
  <!-- A trap for bots: hidden from people, screen readers and the keyboard. -->
  <div aria-hidden="true" style="position:absolute;left:-9999px;height:0;width:0;overflow:hidden">
    <label for="enquiry-botcheck">Leave this empty</label>
    <input id="enquiry-botcheck" name="botcheck" type="text" tabindex="-1" autocomplete="off">
  </div>

  <p class="field">
    <label for="enquiry-name">Name</label>
    <input id="enquiry-name" name="name" type="text" autocomplete="name" maxlength="120" required aria-describedby="enquiry-name-error">
    <span class="field-error" id="enquiry-name-error" hidden>Please add your name.</span>
  </p>
  <p class="field">
    <label for="enquiry-email">Email</label>
    <input id="enquiry-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="200" required aria-describedby="enquiry-email-error">
    <span class="field-error" id="enquiry-email-error" hidden>Please add a valid email so we can reply.</span>
  </p>
  <p class="field">
    <label for="enquiry-message">How can we help?</label>
    <textarea id="enquiry-message" name="message" rows="5" maxlength="2000" required aria-describedby="enquiry-message-error"></textarea>
    <span class="field-error" id="enquiry-message-error" hidden>Add a line or two so we know what you need.</span>
  </p>
  <button type="submit">Send</button>
  <p class="form-problem" role="alert" hidden></p>
</form>
<div id="enquiry-done" role="status" aria-live="polite" tabindex="-1" hidden></div>

<script>
(() => {
  const MODE = 'preview'; // 'preview' or 'live'
  const ACCESS_KEY = 'PASTE-WEB3FORMS-ACCESS-KEY';
  const OWNER = 'the business';
  const EMAIL = 'hello@example.co.uk';
  const SUBJECT = 'New enquiry from the website';

  const form = document.getElementById('enquiry');
  const done = document.getElementById('enquiry-done');
  const problem = form.querySelector('.form-problem');
  const button = form.querySelector('button[type=submit]');
  const EMAIL_SHAPE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  const checks = {
    name: (v) => v.trim().length > 0,
    email: (v) => EMAIL_SHAPE.test(v.trim()),
    message: (v) => v.trim().length > 0,
  };

  function validate() {
    let first = null;
    for (const [field, ok] of Object.entries(checks)) {
      const input = form.elements[field];
      const error = document.getElementById(`enquiry-${field}-error`);
      const valid = ok(input.value);
      error.hidden = valid;
      if (valid) input.removeAttribute('aria-invalid');
      else input.setAttribute('aria-invalid', 'true');
      if (!valid && !first) first = input;
    }
    if (first) first.focus();
    return !first;
  }

  function finish(paragraphs) {
    form.hidden = true;
    done.replaceChildren(...paragraphs.map((text) => {
      const p = document.createElement('p');
      p.textContent = text;
      return p;
    }));
    done.hidden = false;
    done.focus();
  }

  function mailLink() {
    const body = `${form.elements.message.value}\n\n${form.elements.name.value}`;
    return `mailto:${EMAIL}?subject=${encodeURIComponent(SUBJECT)}&body=${encodeURIComponent(body)}`;
  }

  function showProblem() {
    // Whatever they typed stays in the form, so they can press Send again.
    problem.textContent = 'That didn\'t send. Please try again, or ';
    const a = document.createElement('a');
    a.href = mailLink();
    a.textContent = 'email us directly';
    problem.append(a, '.');
    problem.hidden = false;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    problem.hidden = true;
    if (!validate()) return;

    // Preview code: delete from here to the matching end comment before launch.
    if (MODE === 'preview') {
      finish(['Thanks, that all looks right.', `On the live site this would be emailed to ${OWNER}. Nothing has been sent from this preview.`]);
      return;
    }
    // End of preview code.

    button.disabled = true;
    try {
      const response = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          access_key: ACCESS_KEY,
          subject: SUBJECT,
          name: form.elements.name.value.trim(),
          email: form.elements.email.value.trim(),
          message: form.elements.message.value.trim(),
          botcheck: form.elements.botcheck.value,
        }),
      });
      const data = await response.json().catch(() => null);
      if (data && data.success === true) finish(['Thanks, we\'ve got it.', 'We\'ll get back to you shortly.']);
      else showProblem();
    } catch {
      showProblem();
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
